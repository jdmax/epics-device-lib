# Example settings for instruments/pid_controller.py
# Software PID using the simple_pid package: reads input_pv and writes output_pv over
# Channel Access. No hardware. See pid.yaml for the self-contained version with feed-forward.
#
# PVs per channel: {ch}_SP setpoint, {ch}_KP / {ch}_KI / {ch}_KD gains, {ch}_PV process value,
#                  {ch}_CV control output, {ch}_MV manual output, {ch}_Mode (Manual/Auto),
#                  {ch}_DRVH / {ch}_DRVL output limits
# PV keys are full names, including the other IOC's prefix.
pid_temp:
  module: 'devices.instruments.pid_controller'
  autostart: True
  delay: 1              # Update period in seconds
  input_pv: 'PREFIX:Cell_TI'      # Process value to control
  output_pv: 'PREFIX:Heater_CC'   # Where the control output is written
  outs:
    kp: 2.0
    ki: 0.5
    kd: 0.1
    setpoint: 4.5       # Initial setpoint
    min_output: 0       # Output limits, also drive anti-windup
    max_output: 100
    p_on_measurement: False   # Proportional on measurement (default False)
    d_on_measurement: True    # Derivative on measurement (default True)
    auto_start: False   # True starts in Auto, otherwise Manual
  channels:             # Single entry, used as the PV name prefix
    - PID_Temp
  records:
    PID_Temp_SP:
      DESC: 'Temperature Setpoint'
      PREC: 3
      EGU: 'K'
      DRVH: 300
      DRVL: 2
